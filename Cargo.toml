[package]
name = "reify"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.32"
egui = "0.32"
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", features = ["png", "jpeg", "webp", "ico"] }
tiny-skia = "0.11"
fontdue = "0.9"
rfd = "0.15"
percent-encoding = "2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
